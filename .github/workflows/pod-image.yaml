# Builds the prebuilt GPU-pod image (gpu_benchmarks/pod/Dockerfile) and pushes
# it to GHCR, so pod sessions skip rustup + cold cargo builds entirely.
#
# Trigger manually (workflow_dispatch) after pushing prover changes, or it
# fires automatically when the Dockerfile changes. The image embeds the stwo
# rev pinned in the prover manifest and the pushed stwo-cairo ref.
name: pod-image

on:
  workflow_dispatch:
    inputs:
      stwo_rev:
        description: stwo revision to bake (default = rev pinned in Cargo.toml)
        required: false
        default: ""
  push:
    branches: [generic-backend]
    paths:
      - gpu_benchmarks/pod/**
      - .github/workflows/pod-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # The CUDA devel base + two release target dirs need more disk than the
      # default runner leaves free.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Resolve stwo rev
        id: rev
        run: |
          if [ -n "${{ github.event.inputs.stwo_rev }}" ]; then
            echo "stwo_rev=${{ github.event.inputs.stwo_rev }}" >> "$GITHUB_OUTPUT"
          else
            rev=$(grep -om1 'rev = "[0-9a-f]*"' stwo_cairo_prover/Cargo.toml | cut -d'"' -f2)
            echo "stwo_rev=$rev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: gpu_benchmarks/pod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stwo-pod:latest
            ghcr.io/${{ github.repository_owner }}/stwo-pod:${{ github.sha }}
          build-args: |
            STWO_REV=${{ steps.rev.outputs.stwo_rev }}
            CAIRO_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
