# fleet.conf — the pod roster for fleet.sh (the 10–20 MHz aggregate demonstration).
#
# One pod per line. Blank lines and lines starting with '#' are ignored.
# Fields are pipe-separated ('|'); surrounding whitespace is trimmed.
#
#   id | gpu | usd_per_hr | fb_host | fb_port | fb_key | enabled
#
# Field meaning (mirrors loop/pod.conf's resolution model — never trust a hardcoded
# address; the fb_* columns are a FALLBACK only, used with a loud warning when
# `runpodctl ssh info <id>` cannot resolve the pod at runtime):
#
#   id          RunPod pod id. Resolved to ip/port/key at runtime via
#               `runpodctl ssh info <id>`. REQUIRED.
#   gpu         Human GPU label for the report + the same-pod comparison guard
#               (e.g. "RTX 4090"). Free text; REQUIRED.
#   usd_per_hr  On-demand price of this pod, in USD/hour. Drives the $/hr and
#               $/MHz-hr fleet math. REQUIRED (use the price you are actually paying).
#   fb_host     Fallback SSH host (used only if runpodctl resolution fails). Optional.
#   fb_port     Fallback SSH port. Optional.
#   fb_key      Fallback SSH private key path. Optional.
#   enabled     Per-pod kill switch / lane toggle: 1 (default) includes the pod,
#               0 excludes it. This is how the integration agent bisects the fleet —
#               flip a pod to 0 to drop that lane without editing anything else.
#               (`--only <id>` on the CLI runs exactly one pod regardless.)
#
# Only the id, gpu, and usd_per_hr columns are required; trailing columns may be
# omitted (enabled then defaults to 1). Only same-pod comparisons are meaningful
# (community-host variance) — see README.md.
#
# --- example roster (replace with your live pods) -------------------------------
# 5gw3c25kdtmtm7 | RTX 4090 | 0.44 | 213.144.200.241 | 12893 | /Users/theodorepender/.runpod/ssh/runpodctl-ssh-key | 1
