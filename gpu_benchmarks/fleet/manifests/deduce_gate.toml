# DEDUCE GATE — the fp256/EC + blake computed-deduce session (D′ steps 1-3):
# device functions → whole-kernel builtin gates → prove-path engagement → proof
# byte-identity. Validation-ladder order per DEDUCE_DESIGN.md; test gates run
# FIRST because they compile the exact witness kernels (statement-independent
# semantic hash) the prove then reuses from the PTX disk cache.
#
#   gpufleet run manifests/deduce_gate.toml --pod <ID> --purpose deduce-gate
#
# Prereqs: build_and_push (or the manual sm_90 build) done; SN_PIE_2.zip under
# $SN; the prover TEST binary builds in-step (shares the release dep cache —
# same RUSTFLAGS as build_and_push).

[meta]
name = "deduce-gate"
stop_on_failure = true

[env]
RUST_MIN_STACK = "4194304"
STWO_JIT_MAX_KERNEL_INSTRS = "512"
STWO_JIT_CUBIN_CACHE = "1"
GB = "/workspace/stwo-cairo/stwo_cairo_prover/target/release/gpu_bench"
SN = "/workspace/stwo-cairo/gpu_benchmarks/pie/sn"
OUT = "/workspace/out"
PROVER = "/workspace/stwo-cairo/stwo_cairo_prover"

# --- 0. fail fast ---------------------------------------------------------------------
[[step]]
name = "prereqs"
cmd = "mkdir -p $OUT && test -x $GB && test -f $SN/SN_PIE_2.zip && nvidia-smi -L"
timeout_s = 60

# --- 1. build the prover test target (shares the gpu_bench dep cache; nvcc parts
# already built). x86-64-v3 MUST match build_and_push or cargo rebuilds the world. ----
[[step]]
name = "test-build"
cmd = """
. $HOME/.cargo/env; export PATH=/usr/local/cuda/bin:$PATH
cd $PROVER
STWO_CUDA_ARCH=sm_90 RUSTFLAGS="-C target-cpu=x86-64-v3" \
  cargo test --release -p stwo-cairo-prover --no-run 2>&1 | tail -3"""
timeout_s = 3600

# --- 2. ORACLE LEGS: the stwo_wit_deduce device functions vs host fast_deduction.
# Kind 3 = points-table reads across all section boundaries (device-table spot
# check); kind 2 = 64 x 4 chained W18 EC rounds on real curve points. -----------------
[[step]]
name = "oracle-legs"
cmd = """
. $HOME/.cargo/env; export PATH=/usr/local/cuda/bin:$PATH
cd $PROVER
STWO_CUDA_ARCH=sm_90 RUSTFLAGS="-C target-cpu=x86-64-v3" \
  cargo test --release -p stwo-cairo-prover stwo_wit_deduce_oracle -- --nocapture 2>&1 | tail -20"""
timeout_s = 1800
gpu_bound = true
must_match = ['deduce oracle kind 3: PASS', 'deduce oracle kind 2: PASS']
must_not_match = ['SKIPPED \(stub build\)']

# --- 3. WHOLE-KERNEL BUILTIN GATES: the recorded programs as actual CUDA kernels,
# byte-compared against the host writer on every column / lookup / sub word (the
# interp gates' device legs — they auto-run on a CUDA build). This also pays the
# NVRTC+ptxas cost for the aggregator's 5005-instr kernel ONCE, into the PTX cache. --
[[step]]
name = "device-gate-blake"
cmd = """
. $HOME/.cargo/env; export PATH=/usr/local/cuda/bin:$PATH
cd $PROVER
STWO_CUDA_ARCH=sm_90 RUSTFLAGS="-C target-cpu=x86-64-v3" \
  cargo test --release -p stwo-cairo-prover blake_round_recording_interpreter_matches_host -- --nocapture 2>&1 | tail -12"""
timeout_s = 3600
gpu_bound = true
must_match = ['device leg \[blake_round\]: PASS']
must_not_match = ['SKIPPED \(stub build\)']

[[step]]
name = "device-gate-aggregator"
cmd = """
. $HOME/.cargo/env; export PATH=/usr/local/cuda/bin:$PATH
cd $PROVER
STWO_CUDA_ARCH=sm_90 RUSTFLAGS="-C target-cpu=x86-64-v3" \
  cargo test --release -p stwo-cairo-prover pedersen_aggregator_recording_interpreter_matches_host -- --nocapture 2>&1 | tail -12"""
timeout_s = 7200
gpu_bound = true
must_match = ['device leg \[pedersen_aggregator_window_bits_18\]: PASS']
must_not_match = ['SKIPPED \(stub build\)']

# --- 4. Lane-OFF baseline proof (also warms the PIE input cache + composition JIT). --
[[step]]
name = "sn2-lane-off"
cmd = """
$GB --pie $SN/SN_PIE_2.zip --backend cuda --reps 1 --reuse-input > /dev/null 2>&1 || true
STWO_DUMP_PROOF=$OUT/deduce_off.proof $GB --pie $SN/SN_PIE_2.zip --backend cuda \
  --reps 1 --reuse-input 2>&1 | tail -4
test -s $OUT/deduce_off.proof && echo OFF_PROOF_OK"""
timeout_s = 3600
gpu_bound = true
must_match = ['OFF_PROOF_OK']

# --- 5. Lane-ON prove: builtins (aggregator + blake_round) + opcode cohort on the
# witness JIT. Governor raised past the aggregator's 5005 instrs. Engagement is
# asserted, not assumed — a silent fallback fails this step. --------------------------
[[step]]
name = "sn2-lane-on"
cmd = '''
STWO_CUDA_WITNESS_JIT_PROVE=1 STWO_CUDA_WITNESS_JIT_MAX_INSTRS=6000 \
STWO_DUMP_PROOF=$OUT/deduce_on.proof $GB --pie $SN/SN_PIE_2.zip --backend cuda \
  --reps 1 --reuse-input 2> $OUT/deduce_on.err | tail -4
grep -E 'jit_prove\[pedersen_aggregator_window_bits_18\]: device witness' $OUT/deduce_on.err
grep -E 'jit_prove\[blake_round\]: device witness' $OUT/deduce_on.err
grep -E 'falling back' $OUT/deduce_on.err | head -5 || true
test -s $OUT/deduce_on.proof && echo ON_PROOF_OK'''
timeout_s = 7200
gpu_bound = true
must_match = [
  'jit_prove\[pedersen_aggregator_window_bits_18\]: device witness',
  'jit_prove\[blake_round\]: device witness',
  'ON_PROOF_OK',
]

# --- 6. Whole-proof byte identity, lane ON vs OFF. ------------------------------------
[[step]]
name = "sn2-byte-identity"
cmd = """
a=$(sha256sum $OUT/deduce_off.proof | cut -d' ' -f1)
b=$(sha256sum $OUT/deduce_on.proof | cut -d' ' -f1)
echo "off=$a"; echo "on=$b"
if [ "$a" = "$b" ]; then echo PROOF_MATCH; else echo PROOF_MISMATCH; fi"""
timeout_s = 120
must_match = ['PROOF_MATCH']

# (No separate verify step: gpu_bench runs `verify_cairo(..).unwrap()` inside every
# prove — steps 4/5 already fail on an unverifiable proof.)

# --- 7. Perf snapshot, lane on, 3 reps (ledger comparison; not a gate). ---------------
[[step]]
name = "sn2-perf-on"
cmd = """
STWO_CUDA_WITNESS_JIT_PROVE=1 STWO_CUDA_WITNESS_JIT_MAX_INSTRS=6000 \
$GB --pie $SN/SN_PIE_2.zip --backend cuda --reps 3 --reuse-input 2>&1 | tail -12"""
timeout_s = 7200
gpu_bound = true

# --- 8. DEVICE COUNT FEED + EDGES: lane-on prove with the device DAG engaged. --------
[[step]]
name = "sn2-lane-on-dag"
cmd = '''
STWO_CUDA_WITNESS_JIT_PROVE=1 STWO_CUDA_WITNESS_JIT_MAX_INSTRS=20000 \
STWO_CUDA_WITNESS_EDGES=1 \
STWO_DUMP_PROOF=$OUT/dag_on.proof $GB --pie $SN/SN_PIE_2.zip --backend cuda \
  --reps 1 --reuse-input 2> $OUT/dag_on.err | tail -4
grep -E 'device count feed merged' $OUT/dag_on.err | head -3
grep -E 'stashed device edge' $OUT/dag_on.err | head -2
grep -E 'jit_prove\[partial_ec_mul_window_bits_18\]: device witness' $OUT/dag_on.err
grep -E 'jit_prove\[partial_ec_mul_generic\]: device witness' $OUT/dag_on.err
grep -E 'jit_prove\[cube_252\]: device witness' $OUT/dag_on.err || true
test -s $OUT/dag_on.proof && echo DAG_PROOF_OK'''
timeout_s = 7200
gpu_bound = true
must_match = [
  'device count feed merged',
  'stashed device edge',
  'jit_prove\[partial_ec_mul_window_bits_18\]: device witness',
  'jit_prove\[partial_ec_mul_generic\]: device witness',
  'DAG_PROOF_OK',
]

# --- 9. DAG proof byte identity vs the lane-off baseline. -----------------------------
[[step]]
name = "sn2-dag-byte-identity"
cmd = """
a=$(sha256sum $OUT/deduce_off.proof | cut -d' ' -f1)
b=$(sha256sum $OUT/dag_on.proof | cut -d' ' -f1)
echo "off=$a"; echo "dag=$b"
if [ "$a" = "$b" ]; then echo DAG_PROOF_MATCH; else echo DAG_PROOF_MISMATCH; fi"""
timeout_s = 120
must_match = ['DAG_PROOF_MATCH']

# --- 10. C1: 2048-instr composition under the cubin path (the load-time ptxas cliff
# only exists on the PTX path; SASS-at-compile-time makes 2048/-O3 safe). A/B vs the
# 512 split: identity + perf. -----------------------------------------------------------
[[step]]
name = "sn2-cubin-2048"
cmd = '''
STWO_JIT_MAX_KERNEL_INSTRS=2048 STWO_JIT_CUBIN_CACHE=1 \
STWO_DUMP_PROOF=$OUT/c2048.proof $GB --pie $SN/SN_PIE_2.zip --backend cuda \
  --reps 2 --reuse-input 2>&1 | tail -8
a=$(sha256sum $OUT/deduce_off.proof | cut -d' ' -f1)
b=$(sha256sum $OUT/c2048.proof | cut -d' ' -f1)
if [ "$a" = "$b" ]; then echo C2048_PROOF_MATCH; else echo C2048_PROOF_MISMATCH; fi'''
timeout_s = 7200
gpu_bound = true
must_match = ['C2048_PROOF_MATCH']

# --- 11. E2: sustained throughput with the DAG lanes on (the existing P5
# pipeline harness: producers feed adapted inputs; the prover thread runs
# proofs back-to-back sharing every cache). feed_starved_s isolates host-feed
# limits from prover throughput. Measurement, not a gate. ------------------------------
[[step]]
name = "sn2-sustained-dag"
cmd = '''
STWO_CUDA_WITNESS_JIT_PROVE=1 STWO_CUDA_WITNESS_JIT_MAX_INSTRS=20000 \
STWO_CUDA_WITNESS_EDGES=1 \
$GB --pie $SN/SN_PIE_2.zip --backend cuda --pipeline 3 --producers 3 \
  --reuse-input 2>&1 | tail -10'''
timeout_s = 7200
gpu_bound = true
