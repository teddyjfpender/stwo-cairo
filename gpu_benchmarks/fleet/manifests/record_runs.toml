# RECORD RUNS — the composed gpu-native configuration on all four SN PIEs
# (GPU_RESIDENT_PROVER_DESIGN.md: the numbers of record after the M0-M3 gate
# manifest passes). The gpu-native engine applies the composed defaults itself
# (witness JIT + device interaction + device edges + governor 20000); the AOT
# pack serves composition + witness kernels (cap 2048 global env). Every prove
# verifies internally; SN_PIE_2 additionally byte-compares vs the legacy
# engine's proof from the gate manifest.
#
#   gpufleet run manifests/record_runs.toml --pod <ID> --skip-pregate --keep

[meta]
name = "record-runs"
stop_on_failure = false

[env]
RUST_MIN_STACK = "4194304"
STWO_JIT_MAX_KERNEL_INSTRS = "2048"
STWO_JIT_CUBIN_CACHE = "1"
GB = "/workspace/stwo-cairo/stwo_cairo_prover/target/release/gpu_bench"
SN = "/workspace/stwo-cairo/gpu_benchmarks/pie/sn"
OUT = "/workspace/out"

# --- SN_PIE_2 (7.68M steps): the ledger's reference PIE, 3 reps + identity. ---------
[[step]]
name = "record-sn2"
cmd = '''
STWO_BENCH_TRACE=json STWO_DUMP_PROOF=$OUT/record_sn2.proof $GB --pie $SN/SN_PIE_2.zip --backend cuda \
  --engine gpu-native --reps 3 --reuse-input 2> $OUT/record_sn2.err | tail -12
a=$(sha256sum $OUT/deduce_off.proof | cut -d' ' -f1)
b=$(sha256sum $OUT/record_sn2.proof | cut -d' ' -f1)
if [ "$a" = "$b" ]; then echo RECORD_SN2_PROOF_MATCH; else echo RECORD_SN2_PROOF_MISMATCH; fi'''
timeout_s = 7200
gpu_bound = true
must_match = ['RECORD_SN2_PROOF_MATCH']

# --- The 14M-step PIEs (records; verify-gated internally). ---------------------------
[[step]]
name = "record-sn1"
cmd = '''
$GB --pie $SN/SN_PIE_1.zip --backend cuda --engine gpu-native --reps 2 \
  --reuse-input 2>/dev/null | tail -4'''
timeout_s = 10800
gpu_bound = true

[[step]]
name = "record-sn3"
cmd = '''
$GB --pie $SN/SN_PIE_3.zip --backend cuda --engine gpu-native --reps 2 \
  --reuse-input 2>/dev/null | tail -4'''
timeout_s = 10800
gpu_bound = true

[[step]]
name = "record-sn4"
cmd = '''
$GB --pie $SN/SN_PIE_4.zip --backend cuda --engine gpu-native --reps 2 \
  --reuse-input 2>/dev/null | tail -4'''
timeout_s = 10800
gpu_bound = true

# --- Sustained throughput, composed config (P5 harness). ----------------------------
[[step]]
name = "record-sn2-sustained"
cmd = '''
$GB --pie $SN/SN_PIE_2.zip --backend cuda --engine gpu-native --pipeline 3 \
  --producers 3 --reuse-input 2>/dev/null | tail -6'''
timeout_s = 10800
gpu_bound = true
