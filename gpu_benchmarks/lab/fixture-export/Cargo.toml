[package]
name = "stwo-gpu-lab-fixture-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# This generated prover crate otherwise exhausts local memory while emitting
# full debug information. The fixture lab profiles CUDA kernels, not Rust DWARF.
[profile.dev.package.stwo-cairo-prover]
debug = 0

[dependencies]
bincode = "1.3"
cairo-air = { path = "../../../stwo_cairo_prover/crates/cairo-air" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stwo = { path = "../../../../stwo/crates/stwo", features = ["prover"] }
stwo-backend-cuda = { path = "../../../../stwo/crates/backend-cuda" }
stwo-cairo-adapter = { path = "../../../stwo_cairo_prover/crates/adapter" }
stwo-cairo-common = { path = "../../../stwo_cairo_prover/crates/common" }
stwo-cairo-prover = { path = "../../../stwo_cairo_prover/crates/prover", features = ["gpu-lab-oracle"] }
stwo-cairo-serialize = { path = "../../../stwo_cairo_prover/crates/cairo-serialize" }

[patch."https://github.com/teddyjfpender/stwo"]
stwo = { path = "../../../../stwo/crates/stwo" }
stwo-air-utils = { path = "../../../../stwo/crates/air-utils" }
stwo-air-utils-derive = { path = "../../../../stwo/crates/air-utils-derive" }
stwo-backend-cuda = { path = "../../../../stwo/crates/backend-cuda" }
stwo-backend-cuda-kernels = { path = "../../../../stwo/crates/backend-cuda-kernels" }
stwo-constraint-framework = { path = "../../../../stwo/crates/constraint-framework" }
