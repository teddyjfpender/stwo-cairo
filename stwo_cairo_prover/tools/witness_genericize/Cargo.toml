# Standalone (NOT a workspace member) re-runnable transformer that rewrites the
# AIR-generated monomorphic `write_trace_simd` witness writers into a generic per-row
# body over the `WitnessEval` trait, plus a SimdBackend driver (byte-identical) and a
# RecordingEvaluator driver (JIT bytecode). The empty `[workspace]` table below makes
# this its own workspace root so `cargo` does NOT attach it to the parent
# `stwo_cairo_prover` workspace (avoids dependency friction; the tool only needs syn).
[workspace]

[package]
name = "witness_genericize"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "witness_genericize"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"
