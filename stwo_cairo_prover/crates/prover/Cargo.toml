[package]
name = "stwo-cairo-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "STARK prover for Cairo programs using the Stwo proving system"

# NOTE on gpu_bench + pie-bench gating:
# The CairoPie ingestion path in `src/bin/gpu_bench.rs` (and its cairo-program-runner-lib
# dependency) is fully `#[cfg(feature = "pie-bench")]`-gated. We deliberately do NOT set
# `required-features = ["pie-bench"]` on the bin: cargo errors when an explicitly requested
# target (`cargo build --bin gpu_bench`) has unmet required-features, which would break the
# feature-off build. The optional dependency + cfg gating already keep default/wasm builds
# free of the git dependency, so the gating holds without required-features.

[features]
slow-tests = []
relation-tracker = []

# Enables the CairoPie bootloader ingestion path in the gpu_bench binary.
# Kept out of default features so wasm CI checks (wasm64 prover, wasm32 cairo-air)
# are unaffected by the non-wasm cairo-program-runner-lib dependency.
pie-bench = ["dep:cairo-program-runner-lib"]

# Define Nightly features in order to allow selective tests
# Use the following #[cfg(feature = "nightly")]
# to enable nightly features on specific tests.
nightly = []

[dependencies]
stwo-air-utils-derive.workspace = true
stwo-air-utils.workspace = true
hex.workspace = true
itertools.workspace = true
num-traits.workspace = true
paste.workspace = true
# TODO(Ohad): Add parallel config.
stwo-cairo-common = { path = "../common", version = "~1.2.2", features = ["prover"] }
stwo-cairo-adapter = { path = "../adapter", version = "~1.2.2" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
starknet-curve.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
stwo-cairo-serialize = { path = "../cairo-serialize", version = "~1.2.2" }
cairo-air = { path = "../cairo-air", version = "~1.2.2" }
stwo = { workspace = true, features = ["parallel", "prover"] }
stwo-backend-cuda.workspace = true
stwo-backend-cuda-kernels = { git = "https://github.com/teddyjfpender/stwo", rev = "9d7e3d6fa0fc64a0d143a8b2fcb8ee952f4de8f2" }
stwo-constraint-framework = { workspace = true, features = ["parallel", "prover"] }
cairo-vm.workspace = true
libc = "0.2"
bincode = "1"
tracing-subscriber = { workspace = true, features = ["fmt"] }
tracing.workspace = true
dashmap.workspace = true
indexmap.workspace = true
bytemuck.workspace = true

# Optional: CairoPie bootloader ingestion for gpu_bench (--pie). This rev pins
# cairo-vm =3.2.0 (matching ours) and cairo-lang =2.17.0-rc.4. Gated behind the
# `pie-bench` feature so default/wasm builds do not pull it in.
cairo-program-runner-lib = { git = "https://github.com/starkware-libs/proving-utils", rev = "14490bfd", optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
sonic-rs.workspace = true

# Override getrandom feature flags for indirect dependencies.
[target.'cfg(any(target_arch = "wasm32", target_arch = "wasm64"))'.dependencies]
getrandom_v2 = { version = "0.2", package = "getrandom", features = ["js"] }
getrandom_v3 = { version = "0.3", package = "getrandom", features = ["wasm_js"] }

# Used by build.rs (only when the pie-bench feature is enabled) to locate the
# bootloader JSON shipped inside cairo-program-runner-lib via `cargo metadata`.
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
stwo-backend-cuda-kernels = { git = "https://github.com/teddyjfpender/stwo", rev = "9d7e3d6fa0fc64a0d143a8b2fcb8ee952f4de8f2" }
stwo-cairo-dev-utils = { path = "../dev_utils" }
generic-tests = "0.1.3"
tempfile = "3.19.1"
test-log = { version = "0.2.17", features = ["trace"] }
tracing-subscriber.workspace = true
rand.workspace = true
sonic-rs.workspace = true
