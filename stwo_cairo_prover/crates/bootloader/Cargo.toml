[package]
name = "stwo-cairo-bootloader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cairo bootloader (vendored from Moonsong-Labs/cairo-bootloader, Apache-2.0) ported to cairo-vm 3.2 — proves Starknet Cairo PIEs with the stwo prover."

# This crate is a vendored & ported fork of Moonsong-Labs/cairo-bootloader.
# Original source: https://github.com/Moonsong-Labs/cairo-bootloader (Apache-2.0).
# See LICENSE and the NOTICE header in src/lib.rs for attribution.

[dependencies]
# Mirror the workspace cairo-vm features so feature unification is a no-op:
# the workspace already enables extensive_hints + mod_builtin. We add `clap`
# transitively via the workspace too. `zip` (for CairoPie::read_zip_file /
# write_zip_file) is a non-optional dependency of cairo-vm 3.2, always present.
cairo-vm.workspace = true
num-bigint = { version = "0.4", default-features = false }
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pedersen program-hash chain (consensus-critical): keep starknet-crypto 0.6's
# `FieldElement` + `pedersen_hash` API exactly as the upstream bootloader used.
starknet-crypto = "0.6.2"
starknet-types-core.workspace = true
thiserror.workspace = true
thiserror-no-std = "2.0.2"
anyhow.workspace = true

[dev-dependencies]
stwo-cairo-adapter.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
